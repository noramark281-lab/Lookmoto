name: Build Lookmoto APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# contents: write is required so the workflow can publish the built APK as a
# GitHub Release asset, which gives a stable, public, direct download link.
permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          # compileSdk is 36 (see app/build.gradle.kts), so android-36 and
          # build-tools 36.0.0 MUST be installed. android-35 is kept for
          # targetSdk tooling compatibility.
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "platforms;android-35" \
            "build-tools;36.0.0"

      - name: Generate debug keystore
        shell: bash
        run: |
          # The debug build type signs with a custom keystore at the project
          # root (${rootDir}/debug.keystore). That file is git-ignored and is
          # not committed, so it must be created in CI with the exact
          # alias/passwords expected by app/build.gradle.kts.
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        # --no-configuration-cache avoids first-run incompatibilities with the
        # google-services / secrets Gradle plugins that would otherwise fail
        # the configuration-cache enabled build.
        run: ./gradlew --no-daemon --stacktrace --no-configuration-cache clean assembleDebug

      - name: Locate generated APK
        id: apk
        shell: bash
        run: |
          APK_PATH="$(find app/build/outputs/apk -type f -name '*.apk' \
            ! -name '*-androidTest.apk' | head -n 1)"

          if [ -z "$APK_PATH" ]; then
            echo "::error::No APK was generated"
            exit 1
          fi

          mkdir -p release
          cp "$APK_PATH" release/Lookmoto-debug.apk
          echo "path=release/Lookmoto-debug.apk" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lookmoto-debug-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to GitHub Release (direct download link)
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Lookmoto APK build ${{ github.run_number }}
          body: |
            Automated debug APK build.
            Direct download: the Lookmoto-debug.apk asset attached below.
          files: release/Lookmoto-debug.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
