name: Build & Release Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android Licenses
        run: yes | sdkmanager --licenses || true

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x gradlew

      - name: Validate release secrets
        env:
          CM_KEYSTORE_PASSWORD: ${{ secrets.CM_KEYSTORE_PASSWORD }}
          CM_KEY_ALIAS: ${{ secrets.CM_KEY_ALIAS }}
          CM_KEY_PASSWORD: ${{ secrets.CM_KEY_PASSWORD }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          for name in CM_KEYSTORE_PASSWORD CM_KEY_ALIAS CM_KEY_PASSWORD KEYSTORE_BASE64; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Required repository secret $name is not configured"
              exit 1
            fi
          done

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          chmod 600 "$RUNNER_TEMP/release.keystore"

      - name: Build and test signed APKs
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          CM_KEYSTORE_PASSWORD: ${{ secrets.CM_KEYSTORE_PASSWORD }}
          CM_KEY_ALIAS: ${{ secrets.CM_KEY_ALIAS }}
          CM_KEY_PASSWORD: ${{ secrets.CM_KEY_PASSWORD }}
        run: |
          ./gradlew testDebugUnitTest assembleDebug assembleRelease --stacktrace

      - name: Verify signed release APK
        id: find_apk
        run: |
          APK_PATH=app/build/outputs/apk/release/app-release.apk
          test -f "$APK_PATH"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify "$APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: btc-signal-pro-apk
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 30

      - name: Create GitHub Release and Upload APK
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('build-{0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          files: ${{ steps.find_apk.outputs.apk_path }}
          name: BTC Signal Pro Release ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('build-{0}', github.run_number) }}
          body: |
            ## BTC Signal Pro - Android Release
            ### Features included in this build:
            - Real-time BTC/USDT spot ticker via Binance and MEXC public WebSockets.
            - Order Book Depth (live bids/asks volume ladder).
            - Real-time Aggregate Trades tape with buyer/seller pressure metrics.
            - Multi-timeframe OHLCV data pipeline (1m, 5m, 30m).
            - Quantitative indicator engine: RSI(14), MACD(12,26,9), EMA(9, 21, 50), Bollinger Bands(20, 2).
            - Probabilistic sentiment score & automated Risk Matrix (Dynamic Support/Resistance, SL, TP1, TP2, TP3).
            - Direct download link below:
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
