name: Build Lookmoto APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Configure Android SDK
        shell: bash
        run: |
          if [ -z "${ANDROID_HOME:-}" ]; then
            echo "::error::ANDROID_HOME is not set"
            exit 1
          fi

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager 2>/dev/null \
            | sort -V | tail -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found"
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        run: |
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Locate Gradle project
        id: gradle-project
        shell: bash
        run: |
          if [ -f "./gradlew" ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif [ -f "./android/gradlew" ]; then
            echo "dir=android" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Gradle wrapper not found"
            exit 1
          fi

      - name: Make Gradle wrapper executable
        run: chmod +x "${{ steps.gradle-project.outputs.dir }}/gradlew"

      - name: Build debug APK
        working-directory: ${{ steps.gradle-project.outputs.dir }}
        run: ./gradlew --no-daemon clean assembleDebug

      - name: Locate generated APK
        id: apk
        shell: bash
        run: |
          APK_PATH="$(find "${{ steps.gradle-project.outputs.dir }}" \
            -type f -path '*/build/outputs/apk/*/*.apk' \
            ! -name '*-androidTest.apk' | head -n 1)"

          if [ -z "$APK_PATH" ]; then
            echo "::error::No APK was generated"
            exit 1
          fi

          mkdir -p release
          cp "$APK_PATH" release/Lookmoto-debug.apk
          echo "path=release/Lookmoto-debug.apk" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lookmoto-debug-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14
