name: Build Lookmoto APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install required Android SDK packages
        shell: bash
        run: |
          ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found under $ANDROID_HOME"; exit 1
          fi
          echo "Using sdkmanager: $SDKMANAGER"

          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install \
            "platform-tools" \
            "platforms;android-36" \
            "platforms;android-35" \
            "build-tools;36.0.0"

      - name: Generate debug keystore
        shell: bash
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Decode signing keystore if provided
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding upload keystore from secret..."
            echo "$KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks
            echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/my-upload-key.jks" >> "$GITHUB_ENV"
          fi

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build Android APK
        env:
          STORE_PASSWORD: ${{ secrets.CM_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.CM_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CM_KEY_ALIAS }}
        run: |
          if [ -f "my-upload-key.jks" ]; then
            echo "Building Release and Debug APKs..."
            ./gradlew --no-daemon --stacktrace --no-configuration-cache clean assembleRelease assembleDebug || ./gradlew --no-daemon --stacktrace --no-configuration-cache assembleDebug
          else
            echo "Building Debug APK..."
            ./gradlew --no-daemon --stacktrace --no-configuration-cache clean assembleDebug
          fi

      - name: Locate and prepare generated APKs
        id: apk
        shell: bash
        run: |
          mkdir -p release
          RELEASE_APK="$(find app/build/outputs/apk/release -type f -name '*.apk' 2>/dev/null | head -n 1)"
          DEBUG_APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' 2>/dev/null | head -n 1)"

          if [ -n "$RELEASE_APK" ]; then
            echo "Found Release APK: $RELEASE_APK"
            cp "$RELEASE_APK" release/Lookmoto-release.apk
          fi

          if [ -n "$DEBUG_APK" ]; then
            echo "Found Debug APK: $DEBUG_APK"
            cp "$DEBUG_APK" release/Lookmoto-debug.apk
          fi

          if [ ! -f release/Lookmoto-release.apk ] && [ ! -f release/Lookmoto-debug.apk ]; then
            ANY_APK="$(find app/build/outputs/apk -type f -name '*.apk' ! -name '*-androidTest.apk' | head -n 1)"
            if [ -n "$ANY_APK" ]; then
              cp "$ANY_APK" release/Lookmoto-app.apk
            else
              echo "::error::No APK found"; exit 1
            fi
          fi
          ls -la release/

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Lookmoto-APKs
          path: release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to GitHub Release (direct download link)
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Lookmoto APK build ${{ github.run_number }}
          body: |
            ## Lookmoto - BTC Signal Pro Android Release
            
            ### الميزات والتحديثات المشمولة في هذا الإصدار:
            - واجهة كاملة باللغة العربية مع دعم التخصيص والمظهر الليلي الداكن المتطور.
            - محرك تنبؤات احتمالية لحظية للارتفاع والهبوط لزوج BTC/USDT لجميع الأطر الزمنية:
              - 1 دقيقة (1m)
              - 5 دقائق (5m)
              - 10 دقائق (10m)
              - 15 دقيقة (15m)
              - 30 دقيقة (30m)
              - 1 ساعة (1h)
            - أهداف سعرية دقيقة ومستويات وقف الخسارة المقترحة ونطاق التذبذب المتوقع.
            - الربط اللحظي بمواقع الأخبار العالمية ونبض السوق ومؤشر الخوف والطمع (Fear & Greed Index).
            - بث فوري لعمق دفتر الأوامر والصفقات المجمعة عبر خوادم Binance و MEXC WebSockets.
            
            ### روابط التحميل المباشر للـ APK:
            حمل ملف الـ APK مباشرة من قائمة الأصول (Assets) المرفقة أدناه.
          files: release/*.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
